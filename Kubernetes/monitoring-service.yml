apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: miniredis-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-service
  template:
    metadata:
      labels:
        app: monitoring-service
    spec:
      containers:
        - name: monitoring-service
          image: miniredis-monitoring:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: POSTGRES_MAIN_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: POSTGRES_MAIN_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: POSTGRES_MAIN_DB } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: POSTGRES_MAIN_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: miniredis-secrets, key: POSTGRES_MAIN_PASSWORD } }
            - name: NODE_MANAGER_URL
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: NODE_MANAGER_URL } }
            - name: METRICS_POLL_INTERVAL
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: METRICS_POLL_INTERVAL } }
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: miniredis-config, key: LOG_LEVEL } }
          startupProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: miniredis-dev
spec:
  type: ClusterIP
  selector:
    app: monitoring-service
  ports:
    - port: 9000
      targetPort: 9000