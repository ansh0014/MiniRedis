apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniredis-ingress
  namespace: miniredis-dev
spec:
  ingressClassName: nginx
  rules:
    - host: miniredis.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /monitoring
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173